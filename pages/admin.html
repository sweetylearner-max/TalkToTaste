<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – TalkToTaste</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    .admin-page { padding: 100px 40px 80px; max-width: 1100px; margin: 0 auto; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .stat-card .num { font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: var(--primary); }
    .stat-card .label { font-size: 0.85rem; color: var(--text3); font-weight: 600; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
    th { background: var(--bg2); padding: 14px 20px; text-align: left; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text3); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--text2); }
    tr:last-child td { border-bottom: none; }
    @media (max-width: 700px) { .stats-row { grid-template-columns: 1fr 1fr; } .admin-page { padding: 90px 20px 60px; } }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="navbar-brand"><div class="logo-icon">🍲</div> TalkToTaste Admin</a>
  <div class="navbar-actions">
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <a href="../index.html" class="btn btn-outline">← Back to App</a>
  </div>
</nav>

<div class="admin-page">
  <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:900;margin-bottom:8px;">Admin Dashboard</h1>
  <p style="color:var(--text3);margin-bottom:40px;">Manage recipes, users, and analytics</p>

  <div class="stats-row">
    <div class="stat-card"><div class="num">6</div><div class="label">Total Recipes</div></div>
    <div class="stat-card"><div class="num">2</div><div class="label">Languages</div></div>
    <div class="stat-card"><div class="num">4.8</div><div class="label">Avg Rating</div></div>
    <div class="stat-card"><div class="num">90+</div><div class="label">Planned Recipes</div></div>
  </div>

  <h2 style="font-family:var(--font-display);font-size:1.3rem;font-weight:800;margin-bottom:20px;">Recipe Management</h2>
  <table>
    <thead>
      <tr>
        <th>#</th><th>Name</th><th>Cuisine</th><th>Difficulty</th><th>Rating</th><th>Time</th><th>Status</th>
      </tr>
    </thead>
    <tbody id="adminTable"></tbody>
  </table>
</div>

<footer style="text-align:center;padding:32px;background:var(--surface);border-top:1px solid var(--border);margin-top:60px;">
  <span style="font-weight:700;color:var(--primary);font-size:0.85rem;">Developed by Akanksha Bursu</span>
</footer>

<script src="../js/recipes.js"></script>
<script src="../js/timer.js"></script>
<script>
  const tbody = document.getElementById('adminTable');
  RECIPES.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.id}</td><td><strong>${r.emoji} ${r.name}</strong></td><td>${r.cuisine}</td><td>${r.difficulty}</td><td>⭐ ${r.rating}</td><td>${r.time}</td><td><span style="background:#d4f7e8;color:#0d7a4a;padding:3px 10px;border-radius:100px;font-size:0.75rem;font-weight:700;">Active</span></td>`;
    tbody.appendChild(tr);
  });

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    if (isDark) { document.body.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
    else { document.body.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
  }
</script>
</body>
</html>
